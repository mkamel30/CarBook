name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & publish signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Guard tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --prefix mobile install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Test Suite
        run: |
          pnpm test
          pnpm --prefix mobile test

      - name: Build Mobile Bundle
        run: pnpm --prefix mobile build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/carbook-release.keystore
          printf 'storeFile=carbook-release.keystore\nstorePassword=%s\nkeyAlias=carbook\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Asset
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "CarBook-v${{ env.VERSION }}.apk"
          sha256sum "CarBook-v${{ env.VERSION }}.apk" > "CarBook-v${{ env.VERSION }}.apk.sha256"
          ls -la CarBook-v*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CarBook ${{ env.VERSION }}
          body: |
            CarBook ${{ env.VERSION }} — signed release APK.

            Install: enable "install unknown apps" for your browser, download the
            APK below and open it.
          files: |
            CarBook-v*.apk
            CarBook-v*.apk.sha256
