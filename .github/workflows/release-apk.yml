name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & publish signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Guard tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --prefix mobile install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Test Suite
        run: |
          pnpm test
          pnpm --prefix mobile test

      - name: Bake server origin into the mobile bundle
        run: |
          # mobile/.env is gitignored, so a CI build would otherwise bake an
          # empty SERVER_BASE_URL and every auth/AI call silently no-ops.
          # config.xml is the committed single source of truth — derive from it
          # so the JS bundle and the native handoff can never point at different
          # hosts. Fail loudly (rule 8) rather than ship a login that does nothing.
          URL=$(sed -n 's:.*<string name="server_url"[^>]*>\(.*\)</string>.*:\1:p' \
                android/app/src/main/res/values/config.xml | head -n1 | tr -d '[:space:]')
          if [ -z "$URL" ]; then
            echo "::error::Could not read <string name=\"server_url\"> from config.xml"
            exit 1
          fi
          case "$URL" in
            https://*) ;;
            *) echo "::error::server_url is not an https origin: $URL"; exit 1 ;;
          esac
          echo "VITE_CARBOOK_SERVER_URL=$URL" > mobile/.env
          echo "Baking mobile bundle against $URL"

      - name: Build Mobile Bundle
        run: pnpm --prefix mobile build

      - name: Sync Capacitor Android
        run: |
          set +e
          pnpm exec cap sync android > cap-sync.log 2>&1
          code=$?
          cat cap-sync.log
          if [ "$code" -ne 0 ]; then
            echo "::error::cap sync android failed (exit $code)"
            # Surface the log tail as annotations (readable via the check-runs
            # API without auth) so a CI-only failure is diagnosable.
            tail -n 25 cap-sync.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$code"
          fi

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/carbook-release.keystore
          printf 'storeFile=carbook-release.keystore\nstorePassword=%s\nkeyAlias=carbook\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties

      - name: Build Release APK
        working-directory: android
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon > gradle-build.log 2>&1
          code=$?
          tail -n 200 gradle-build.log
          if [ "$code" -ne 0 ]; then
            echo "::error::assembleRelease failed (exit $code)"
            tail -n 25 gradle-build.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit "$code"
          fi

      - name: Prepare Release Asset
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "CarBook-v${{ env.VERSION }}.apk"
          sha256sum "CarBook-v${{ env.VERSION }}.apk" > "CarBook-v${{ env.VERSION }}.apk.sha256"
          ls -la CarBook-v*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CarBook ${{ env.VERSION }}
          body: |
            CarBook ${{ env.VERSION }} — signed release APK.

            Install: enable "install unknown apps" for your browser, download the
            APK below and open it.
          files: |
            CarBook-v*.apk
            CarBook-v*.apk.sha256
